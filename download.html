<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Your Book is Ready</title>

<style>
body{
margin:0;
font-family:Arial;
background:radial-gradient(circle,#0d0d0d,#000);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
}

.box{
background:rgba(255,255,255,0.05);
padding:40px;
border-radius:20px;
box-shadow:0 0 25px rgba(0,0,0,0.7);
max-width:500px;
}

h1{
color:#f0b90b;
}

p{
opacity:0.8;
line-height:1.6;
}

button{
margin-top:20px;
padding:15px 25px;
background:linear-gradient(90deg,#00c853,#00e676);
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
font-weight:bold;
}

button:hover{
transform:scale(1.05);
transition:0.2s;
}

.small{
font-size:12px;
opacity:0.6;
margin-top:15px;
}
</style>
</head>

<body>

<div class="box">

<h1>📘 Your Book is Ready</h1>

<p>
Thank you for your participation in <b>The Mystery Book Challenge</b>.<br><br>
You can now download your official copy below.
</p>

<a href="https://drive.google.com/file/d/1cPgwEJ7G96JeOboAyjRmov9n8rTGg40-/view?usp=sharing" target="_blank">
<button>📥 Download Book</button>
</a>

<p class="small">
⚠️ Keep this link private. Sharing is not allowed.
</p>

</div>

</body>
</html>
